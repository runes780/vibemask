name: Security gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-audit-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and security tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest tests/ -v
      - name: Lint
        run: >-
          python -m ruff check
          vibemask/vault vibemask/cli.py tests/test_vault_*.py
          scripts/vault_keyring_smoke.py
      - name: Audit Python dependencies
        run: python -m pip_audit
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --output-file sbom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: vibemask-cyclonedx-sbom
          path: sbom.json
          if-no-files-found: error
